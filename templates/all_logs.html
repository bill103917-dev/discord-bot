<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>所有指令紀錄</title>
    <style>
        body {
            font-family: 'Noto Sans CJK TC', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2f3136;
            color: #dcddde;
        }
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
            background-color: #36393f;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .search-input {
            flex: 1;
            min-width: 220px;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #4a4d53;
            background-color: #202225;
            color: #dcddde;
            font-size: 14px;
        }
        .refresh-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background-color: #5865f2;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background-color: #4752c4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #4a4d53;
            word-break: break-word;
        }
        th {
            background-color: #2e3136;
            color: #99aab5;
        }
        tr:hover {
            background-color: #40444b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>所有指令紀錄</h1>
        <div class="toolbar">
            <input type="text" id="log-search" class="search-input" placeholder="搜尋指令、使用者、伺服器或時間...">
            <button type="button" id="manual-refresh" class="refresh-btn">立即重新整理</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>時間</th>
                    <th>事件</th>
                </tr>
            </thead>
            <tbody id="log-table-body">
                </tbody>
        </table>
    </div>

    <script>
        let latestLogs = [];

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderLogs() {
            const tableBody = document.getElementById('log-table-body');
            const keyword = (document.getElementById('log-search').value || '').trim().toLowerCase();
            tableBody.innerHTML = '';

            const filtered = [...latestLogs].reverse().filter(log => {
                if (!keyword) return true;
                const timeStr = String(log.time ?? '').toLowerCase();
                const textStr = String(log.text ?? '').toLowerCase();
                return timeStr.includes(keyword) || textStr.includes(keyword);
            });

            if (filtered.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#99aab5;">目前沒有符合的指令紀錄</td></tr>';
                return;
            }

            filtered.forEach(log => {
                const row = `<tr><td>${escapeHtml(log.time)}</td><td>${escapeHtml(log.text)}</td></tr>`;
                tableBody.innerHTML += row;
            });
        }

        // Function to fetch and update logs
        function fetchLogs() {
            fetch('/logs/data')
                .then(response => response.json())
                .then(logs => {
                    latestLogs = Array.isArray(logs) ? logs : [];
                    renderLogs();
                })
                .catch(error => console.error('Error fetching logs:', error));
        }

        document.getElementById('log-search').addEventListener('input', renderLogs);
        document.getElementById('manual-refresh').addEventListener('click', fetchLogs);

        // Fetch logs every 5 seconds
        setInterval(fetchLogs, 5000);
        
        // Fetch logs immediately on page load
        fetchLogs();
    </script>
</body>
</html>
