<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Voice Overlay - Channel {{ channel_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            overflow: hidden;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }
        /* 基礎頭像卡片 */
        .avatar-card {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: brightness(0.6) grayscale(0.1);
            opacity: 0.8;
            transform: translateY(0);
        }
        /* 🗣️ 說話/未靜音高亮狀態 */
        .avatar-card.active {
            filter: brightness(1) grayscale(0);
            opacity: 1;
            transform: translateY(-6px);
        }
        .avatar-ring {
            border: 3px solid transparent;
            transition: all 0.15s ease;
        }
        .avatar-card.active .avatar-ring {
            border-color: #23a55a;
            box-shadow: 0 0 12px rgba(35, 165, 90, 0.6);
        }
        .avatar-card.active .user-name {
            background-color: #23a55a;
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body class="p-4 flex flex-col justify-between min-h-screen select-none">

    <!-- 頂部連線狀態條 -->
    <div id="status-bar" class="w-full flex items-center justify-between bg-slate-900/90 border border-slate-700 px-3 py-1.5 rounded-lg text-xs text-white">
        <div class="flex items-center gap-2">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
            <span id="status-text" class="text-slate-300 font-mono">正在同步語音成員...</span>
        </div>
        <span class="text-slate-500">Channel ID: {{ channel_id }}</span>
    </div>

    <!-- 📺 頭像顯示區域 -->
    <div id="users-container" class="my-auto flex flex-row flex-nowrap items-end gap-5 max-w-full overflow-x-auto py-6">
        <div class="text-xs text-slate-400 border border-dashed border-slate-700 p-4 rounded-xl text-center w-full">
            ⏳ 正在連接並獲取語音頻道成員名單...
        </div>
    </div>

    <script>
        const channelId = "{{ channel_id }}";
        const MAX_VISIBLE = {{ max_visible }};
        
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/${channelId}`;
        
        let membersMap = new Map();
        let isClosed = false;

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");

        function updateStatus(connected, msg) {
            if (isClosed) return;
            if (connected) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                statusText.innerText = msg || "✅ 已同步語音成員名單";
                statusText.className = "text-emerald-400 font-semibold";
            } else {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping";
                statusText.innerText = msg || "⚠️ 重新連線中...";
                statusText.className = "text-amber-400 font-mono";
            }
        }

        function connect() {
            if (isClosed) return;
            const ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateStatus(true, "✅ 連線成功，請求成員資料中...");
                // 連線建立後立刻主動請求獲取最新成員名單
                ws.send(JSON.stringify({ action: "request_init" }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.action === "close") {
                        isClosed = true;
                        ws.close();
                        showClosedScreen();
                        return;
                    }

                    if (data.action === "init" && Array.isArray(data.members)) {
                        membersMap.clear();
                        data.members.forEach(m => membersMap.set(m.id, m));
                        updateStatus(true, `✅ 已成功載入 ${data.members.length} 位成員`);
                    } else if (data.action === "remove") {
                        membersMap.delete(data.id);
                    } else if (data.action === "update") {
                        membersMap.set(data.id, data);
                    }
                    
                    renderOverlay();
                } catch (e) {
                    console.error("解析 WebSocket 資料失敗:", e);
                }
            };

            ws.onclose = () => {
                if (!isClosed) {
                    updateStatus(false, "🔄 連線中斷，2秒後重試...");
                    setTimeout(connect, 2000);
                }
            };
        }

        function showClosedScreen() {
            const container = document.getElementById("users-container");
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
            statusText.innerText = "🛑 疊加服務已終止";
            statusText.className = "text-red-400 font-semibold";
            
            container.innerHTML = `
                <div class="text-xs text-red-400 border border-red-500/40 bg-red-950/20 p-4 rounded-xl text-center w-full">
                    🛑 該頻道的實況疊加層服務已被關閉。
                </div>
            `;
        }

        function renderOverlay() {
            if (isClosed) return;
            const container = document.getElementById("users-container");
            container.innerHTML = "";

            const members = Array.from(membersMap.values());
            
            if (members.length === 0) {
                container.innerHTML = `
                    <div class="text-xs text-slate-400 border border-dashed border-slate-700 p-4 rounded-xl text-center w-full">
                        🎙️ 語音頻道內目前沒有成員。
                    </div>
                `;
                return;
            }

            const visibleMembers = members.slice(0, MAX_VISIBLE);
            const hiddenMembers = members.slice(MAX_VISIBLE);

            // 1. 繪製前 MAX_VISIBLE 個成員
            visibleMembers.forEach(user => {
                const card = document.createElement("div");
                card.id = `user-${user.id}`;
                card.className = `avatar-card flex-shrink-0 flex flex-col items-center space-y-2 ${user.speaking ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="relative">
                        <div class="avatar-ring w-16 h-16 rounded-full overflow-hidden p-0.5 bg-slate-800 shadow-md">
                            <img src="${user.avatar}" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        </div>
                    </div>
                    <span class="user-name text-xs bg-slate-800/90 text-slate-200 px-2.5 py-0.5 rounded-full shadow max-w-[90px] truncate">
                        ${user.name}
                    </span>
                `;
                container.appendChild(card);
            });

            // 2. 超出限制自動轉為 +N
            if (hiddenMembers.length > 0) {
                const isAnyHiddenActive = hiddenMembers.some(u => u.speaking);
                const plusCard = document.createElement("div");
                plusCard.className = `avatar-card flex-shrink-0 flex flex-col items-center space-y-2 ${isAnyHiddenActive ? 'active' : ''}`;
                plusCard.innerHTML = `
                    <div class="relative">
                        <div class="avatar-ring w-16 h-16 rounded-full bg-slate-800/90 border-2 border-slate-600 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-md">
                            +${hiddenMembers.length}
                        </div>
                    </div>
                    <span class="user-name text-xs bg-slate-800/90 text-slate-300 px-2.5 py-0.5 rounded-full shadow">
                        其餘成員
                    </span>
                `;
                container.appendChild(plusCard);
            }
        }

        connect();
    </script>
</body>
</html>
