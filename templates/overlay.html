<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Voice Overlay - Channel {{ channel_id }}</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            overflow: hidden;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        /* 🎨 預設（沒說話/安靜時）：頭像微暗、稍微縮小 */
        .avatar-card {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        filter 0.2s ease, 
                        opacity 0.2s ease;
            filter: brightness(0.4) grayscale(0.2);
            opacity: 0.6;
            transform: translateY(0) scale(0.95);
        }

        /* 🗣️ 正在說話時：亮起、恢復原色、向上浮起 */
        .avatar-card.speaking {
            filter: brightness(1.1) grayscale(0);
            opacity: 1;
            transform: translateY(-8px) scale(1.05);
        }

        .avatar-ring {
            border: 3px solid transparent;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        /* 說話時的亮綠圈與柔光 */
        .avatar-card.speaking .avatar-ring {
            border-color: #23a55a;
            box-shadow: 0 0 16px rgba(35, 165, 90, 0.8), inset 0 0 6px rgba(35, 165, 90, 0.4);
        }

        .user-name {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .avatar-card.speaking .user-name {
            background-color: #23a55a;
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(35, 165, 90, 0.4);
        }

        .fade-transition {
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="p-4 flex flex-col justify-between min-h-screen select-none">

    <!-- 頂部連線狀態條 -->
    <div id="status-bar" class="w-full flex items-center justify-between bg-slate-900/90 border border-slate-700/80 backdrop-blur-md px-3.5 py-2 rounded-xl text-xs text-white shadow-xl fade-transition">
        <div class="flex items-center gap-2.5">
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span id="status-text" class="text-slate-300 font-mono">✅ 語音開口說話偵測中</span>
        </div>
        <span class="text-slate-500 font-mono text-[11px]">Channel: {{ channel_id }}</span>
    </div>

    <!-- 📺 主要內容區域 (頭像 / 倒數卡片) -->
    <div id="main-content" class="my-auto w-full flex items-center justify-center fade-transition">
        <div id="users-container" class="flex flex-row flex-nowrap items-end gap-6 max-w-full overflow-x-auto py-8 px-2 w-full">
            <div class="text-xs text-slate-400 border border-dashed border-slate-700/80 p-4 rounded-xl text-center w-full backdrop-blur-sm">
                ⏳ 正在載入語音頻道成員名單...
            </div>
        </div>
    </div>

    <script>
        const channelId = "{{ channel_id }}";
        let MAX_VISIBLE = {{ max_visible }};
        
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws/${channelId}`;
        
        let membersMap = new Map();
        let speakingTimers = new Map();
        let isClosed = false;
        let socket = null;
        let heartbeatInterval = null;

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");

        // 🎙️ 處理開口說話事件：亮綠框 + 說完話自然消退
        function handleSpeakingEvent(userId, isSpeaking) {
            if (isClosed || !membersMap.has(userId)) return;

            const member = membersMap.get(userId);

            if (isSpeaking) {
                member.speaking = true;
                // 清除舊的消退計時器
                if (speakingTimers.has(userId)) {
                    clearTimeout(speakingTimers.get(userId));
                }
                // 發言防抖：講話停下來 400ms 後，綠框立刻消失
                const timer = setTimeout(() => {
                    if (membersMap.has(userId)) {
                        membersMap.get(userId).speaking = false;
                        renderOverlay();
                    }
                }, 400);
                speakingTimers.set(userId, timer);
            } else {
                member.speaking = false;
                if (speakingTimers.has(userId)) {
                    clearTimeout(speakingTimers.get(userId));
                    speakingTimers.delete(userId);
                }
            }
            renderOverlay();
        }

        function connect() {
            if (isClosed) return;
            socket = new WebSocket(wsUrl);
            
            socket.onopen = () => {
                socket.send(JSON.stringify({ action: "request_init" }));

                // 每 1 秒心跳同步最新成員進出名單
                if (heartbeatInterval) clearInterval(heartbeatInterval);
                heartbeatInterval = setInterval(() => {
                    if (socket && socket.readyState === WebSocket.OPEN && !isClosed) {
                        socket.send(JSON.stringify({ action: "request_init" }));
                    }
                }, 1000);
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // 🛑 1. 收到結束關閉指令
                    if (data.action === "close") {
                        isClosed = true;
                        if (heartbeatInterval) clearInterval(heartbeatInterval);
                        socket.close();
                        startCountdownAndDestroy();
                        return;
                    }

                    // ⚙️ 2. 收到按鈕設定更新指令 (即時改上限)
                    if (data.action === "config_update" && data.max_visible) {
                        MAX_VISIBLE = parseInt(data.max_visible);
                        renderOverlay();
                        return;
                    }

                    // 📋 3. 收到成員初始化名單
                    if (data.action === "init" && Array.isArray(data.members)) {
                        const newMap = new Map();
                        data.members.forEach(m => {
                            // 保留目前的 speaking 狀態，預設為未發言(false)
                            const oldMember = membersMap.get(m.id);
                            m.speaking = oldMember ? oldMember.speaking : false;
                            newMap.set(m.id, m);
                        });

                        membersMap = newMap;
                        renderOverlay();
                    } 
                    // 🗣️ 4. 收到說話動態訊號 (true/false)
                    else if (data.action === "update") {
                        handleSpeakingEvent(data.id, data.speaking);
                    }
                } catch (e) {
                    console.error("解析 WebSocket 資料失敗:", e);
                }
            };

            socket.onclose = () => {
                if (heartbeatInterval) clearInterval(heartbeatInterval);
                if (!isClosed) {
                    setTimeout(connect, 2000);
                }
            };
        }

        // ⏱️ 5秒倒數關閉與徹底清空網頁
        function startCountdownAndDestroy() {
            const statusBar = document.getElementById("status-bar");
            const mainContent = document.getElementById("main-content");

            if (statusBar) statusBar.style.opacity = "0";

            let timeLeft = 5;
            
            const updateCountdownUI = () => {
                mainContent.innerHTML = `
                    <div class="bg-slate-900/90 border border-red-500/40 p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full space-y-3 backdrop-blur-md">
                        <div class="flex items-center justify-center gap-2 text-red-400 font-bold text-sm">
                            <span class="animate-bounce">🛑</span> 實況語音疊加層服務已結束
                        </div>
                        <p class="text-xs text-slate-400">管理員已關閉此頻道服務，網頁將於倒數後自動關閉...</p>
                        <div class="text-2xl font-black text-amber-400 font-mono tracking-wider">
                            ${timeLeft} 秒
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-red-500 h-1.5 transition-all duration-1000 ease-linear" style="width: ${(timeLeft / 5) * 100}%"></div>
                        </div>
                    </div>
                `;
            };

            updateCountdownUI();

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    updateCountdownUI();
                } else {
                    clearInterval(timer);
                    document.body.innerHTML = "";
                    document.body.style.backgroundColor = "transparent";
                }
            }, 1000);
        }

        function renderOverlay() {
            if (isClosed) return;
            const container = document.getElementById("users-container");
            if (!container) return;

            const members = Array.from(membersMap.values());
            
            if (members.length === 0) {
                container.innerHTML = `
                    <div class="text-xs text-slate-400 border border-dashed border-slate-700/80 p-4 rounded-xl text-center w-full backdrop-blur-sm">
                        🎙️ 語音頻道內目前沒有成員。
                    </div>
                `;
                return;
            }

            const visibleMembers = members.slice(0, MAX_VISIBLE);
            const hiddenMembers = members.slice(MAX_VISIBLE);

            container.innerHTML = "";

            visibleMembers.forEach(user => {
                const card = document.createElement("div");
                card.id = `user-${user.id}`;
                card.className = `avatar-card flex-shrink-0 flex flex-col items-center space-y-2 ${user.speaking ? 'speaking' : ''}`;
                card.innerHTML = `
                    <div class="relative">
                        <div class="avatar-ring w-16 h-16 rounded-full overflow-hidden p-0.5 bg-slate-800/90 shadow-lg">
                            <img src="${user.avatar}" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        </div>
                    </div>
                    <span class="user-name text-xs bg-slate-800/90 text-slate-200 px-2.5 py-0.5 rounded-full shadow-md max-w-[95px] truncate">
                        ${user.name}
                    </span>
                `;
                container.appendChild(card);
            });

            if (hiddenMembers.length > 0) {
                const isAnyHiddenSpeaking = hiddenMembers.some(u => u.speaking);
                const plusCard = document.createElement("div");
                plusCard.className = `avatar-card flex-shrink-0 flex flex-col items-center space-y-2 ${isAnyHiddenSpeaking ? 'speaking' : ''}`;
                plusCard.innerHTML = `
                    <div class="relative">
                        <div class="avatar-ring w-16 h-16 rounded-full bg-slate-800/90 border-2 border-slate-600/80 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-lg">
                            +${hiddenMembers.length}
                        </div>
                    </div>
                    <span class="user-name text-xs bg-slate-800/90 text-slate-300 px-2.5 py-0.5 rounded-full shadow-md">
                        其餘成員
                    </span>
                `;
                container.appendChild(plusCard);
            }
        }

        connect();
    </script>
</body>
</html>
