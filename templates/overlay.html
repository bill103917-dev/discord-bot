<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Voice Overlay - Channel {{ channel_id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: transparent;
            overflow: hidden;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        .avatar-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        filter 0.3s ease, 
                        opacity 0.3s ease;
            filter: brightness(0.4) grayscale(0.2);
            opacity: 0.6;
            transform: scale(0.95);
        }

        .layout-horizontal .avatar-card.speaking {
            filter: brightness(1.1) grayscale(0);
            opacity: 1;
            transform: translateY(-8px) scale(1.05);
        }

        .layout-vertical .avatar-card.speaking {
            filter: brightness(1.1) grayscale(0);
            opacity: 1;
            transform: translateX(8px) scale(1.05);
        }

        .avatar-ring {
            border: 3px solid transparent;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .avatar-card.speaking .avatar-ring {
            border-color: #23a55a;
            box-shadow: 0 0 16px rgba(35, 165, 90, 0.8), inset 0 0 6px rgba(35, 165, 90, 0.4);
            animation: voice-pulse 1.8s infinite ease-in-out;
        }

        .user-name {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .avatar-card.speaking .user-name {
            background-color: #23a55a;
            color: #ffffff;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(35, 165, 90, 0.4);
        }

        @keyframes voice-pulse {
            0%, 100% { box-shadow: 0 0 14px rgba(35, 165, 90, 0.7); }
            50% { box-shadow: 0 0 22px rgba(35, 165, 90, 0.95); }
        }

        .fade-transition {
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="p-4 flex flex-col justify-end min-h-screen select-none">

    <div id="main-content" class="w-full flex items-center justify-start fade-transition">
        <div id="users-container" class="flex flex-row flex-nowrap items-end gap-6 max-w-full overflow-x-auto py-8 px-2 w-full layout-horizontal">
        </div>
    </div>

    <script>
        const channelId = "{{ channel_id }}";
        let MAX_VISIBLE = {{ max_visible }};
        let LAYOUT_MODE = 'horizontal';
        let DETECT_MODE = 'auto'; // 'auto' | 'rpc' | 'state'
        
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const botWsUrl = `${protocol}//${window.location.host}/ws/${channelId}`;
        
        let membersMap = new Map();
        let isClosed = false;
        let socket = null;
        let heartbeatInterval = null;
        let rpcConnected = false;

        function connectBotSocket() {
            if (isClosed) return;
            socket = new WebSocket(botWsUrl);

            socket.onopen = () => {
                socket.send(JSON.stringify({ action: "request_init" }));

                if (heartbeatInterval) clearInterval(heartbeatInterval);
                heartbeatInterval = setInterval(() => {
                    if (socket && socket.readyState === WebSocket.OPEN && !isClosed) {
                        socket.send(JSON.stringify({ action: "request_init" }));
                    }
                }, 1000);
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.action === "close") {
                        isClosed = true;
                        if (heartbeatInterval) clearInterval(heartbeatInterval);
                        if (socket) socket.close();
                        startCountdownAndDestroy();
                        return;
                    }

                    if (data.action === "config_update") {
                        if (data.max_visible) MAX_VISIBLE = parseInt(data.max_visible);
                        if (data.layout_mode) LAYOUT_MODE = data.layout_mode;
                        if (data.detect_mode) DETECT_MODE = data.detect_mode;
                        renderOverlay();
                        return;
                    }

                    if (data.action === "init" && Array.isArray(data.members)) {
                        data.members.forEach(m => {
                            if (!membersMap.has(m.id)) {
                                membersMap.set(m.id, m);
                            } else {
                                const existing = membersMap.get(m.id);
                                existing.name = m.name;
                                existing.avatar = m.avatar;
                                // 若非純 RPC 模式，由伺服器帶入開麥狀態
                                if (DETECT_MODE === 'state' || (DETECT_MODE === 'auto' && !rpcConnected)) {
                                    existing.speaking = m.speaking;
                                }
                            }
                        });
                        renderOverlay();
                    }
                    else if (data.action === "update") {
                        if (DETECT_MODE === 'state' || (DETECT_MODE === 'auto' && !rpcConnected)) {
                            if (membersMap.has(data.id)) {
                                membersMap.get(data.id).speaking = data.speaking;
                            } else {
                                membersMap.set(data.id, data);
                            }
                            renderOverlay();
                        }
                    }
                } catch (e) {
                    console.error("WS 錯誤:", e);
                }
            };

            socket.onclose = () => {
                if (!isClosed) setTimeout(connectBotSocket, 2000);
            };
        }

        // 🎙️ 本機 RPC 講話動態監聽
        function connectDiscordRPC() {
            const rpcPorts = [6463, 6464, 6465];
            rpcPorts.forEach(port => {
                if (rpcConnected || isClosed) return;
                const rpcWs = new WebSocket(`ws://127.0.0.1:${port}/?v=1&client_id=100000000000000000`);

                rpcWs.onopen = () => {
                    rpcConnected = true;
                    rpcWs.send(JSON.stringify({ cmd: "SUBSCRIBE", evt: "SPEAKING_START", args: { channel_id: channelId }, nonce: "1" }));
                    rpcWs.send(JSON.stringify({ cmd: "SUBSCRIBE", evt: "SPEAKING_STOP", args: { channel_id: channelId }, nonce: "2" }));
                };

                rpcWs.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (DETECT_MODE === 'rpc' || (DETECT_MODE === 'auto' && rpcConnected)) {
                            if (data.evt === "SPEAKING_START" && data.data) {
                                setSpeakingState(String(data.data.user_id), true);
                            } else if (data.evt === "SPEAKING_STOP" && data.data) {
                                setSpeakingState(String(data.data.user_id), false);
                            }
                        }
                    } catch (e) {}
                };
            });
        }

        function setSpeakingState(userId, isSpeaking) {
            if (membersMap.has(userId)) {
                membersMap.get(userId).speaking = isSpeaking;
                renderOverlay();
            }
        }

        function startCountdownAndDestroy() {
            const mainContent = document.getElementById("main-content");
            let timeLeft = 5;
            
            const updateCountdownUI = () => {
                mainContent.innerHTML = `
                    <div class="bg-slate-900/90 border border-red-500/40 p-6 rounded-2xl shadow-2xl text-center max-w-sm w-full space-y-3 backdrop-blur-md">
                        <div class="flex items-center justify-center gap-2 text-red-400 font-bold text-sm">
                            <span class="animate-bounce">🛑</span> 實況語音疊加層服務已結束
                        </div>
                        <p class="text-xs text-slate-400">管理員已關閉此頻道服務，網頁將於倒數後自動關閉...</p>
                        <div class="text-2xl font-black text-amber-400 font-mono tracking-wider">
                            ${timeLeft} 秒
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-red-500 h-1.5 transition-all duration-1000 ease-linear" style="width: ${(timeLeft / 5) * 100}%"></div>
                        </div>
                    </div>
                `;
            };

            updateCountdownUI();

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    updateCountdownUI();
                } else {
                    clearInterval(timer);
                    document.body.innerHTML = "";
                    document.body.style.backgroundColor = "transparent";
                }
            }, 1000);
        }

        function renderOverlay() {
            if (isClosed) return;
            const container = document.getElementById("users-container");
            if (!container) return;

            if (LAYOUT_MODE === 'vertical') {
                container.className = "flex flex-col items-start gap-4 max-h-full py-2 px-2 w-full layout-vertical";
            } else {
                container.className = "flex flex-row flex-nowrap items-end gap-6 max-w-full overflow-x-auto py-8 px-2 w-full layout-horizontal";
            }

            const members = Array.from(membersMap.values());
            if (members.length === 0) {
                container.innerHTML = "";
                return;
            }

            const visibleMembers = members.slice(0, MAX_VISIBLE);
            const hiddenMembers = members.slice(MAX_VISIBLE);

            container.innerHTML = "";

            visibleMembers.forEach(user => {
                const card = document.createElement("div");
                card.id = `user-${user.id}`;
                
                if (LAYOUT_MODE === 'vertical') {
                    card.className = `avatar-card flex-shrink-0 flex flex-row items-center space-x-3 ${user.speaking ? 'speaking' : ''}`;
                    card.innerHTML = `
                        <div class="relative">
                            <div class="avatar-ring w-12 h-12 rounded-full overflow-hidden p-0.5 bg-slate-800/90 shadow-lg">
                                <img src="${user.avatar}" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                            </div>
                        </div>
                        <span class="user-name text-xs bg-slate-800/90 text-slate-200 px-3 py-1 rounded-full shadow-md max-w-[120px] truncate">
                            ${user.name}
                        </span>
                    `;
                } else {
                    card.className = `avatar-card flex-shrink-0 flex flex-col items-center space-y-2 ${user.speaking ? 'speaking' : ''}`;
                    card.innerHTML = `
                        <div class="relative">
                            <div class="avatar-ring w-16 h-16 rounded-full overflow-hidden p-0.5 bg-slate-800/90 shadow-lg">
                                <img src="${user.avatar}" class="w-full h-full object-cover rounded-full" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                            </div>
                        </div>
                        <span class="user-name text-xs bg-slate-800/90 text-slate-200 px-2.5 py-0.5 rounded-full shadow-md max-w-[95px] truncate">
                            ${user.name}
                        </span>
                    `;
                }

                container.appendChild(card);
            });

            if (hiddenMembers.length > 0) {
                const isAnyHiddenSpeaking = hiddenMembers.some(u => u.speaking);
                const plusCard = document.createElement("div");
                
                if (LAYOUT_MODE === 'vertical') {
                    plusCard.className = `avatar-card flex-shrink-0 flex flex-row items-center space-x-3 ${isAnyHiddenSpeaking ? 'speaking' : ''}`;
                    plusCard.innerHTML = `
                        <div class="relative">
                            <div class="avatar-ring w-12 h-12 rounded-full bg-slate-800/90 border-2 border-slate-600/80 flex items-center justify-center text-emerald-400 font-bold text-sm shadow-lg">
                                +${hiddenMembers.length}
                            </div>
                        </div>
                        <span class="user-name text-xs bg-slate-800/90 text-slate-300 px-3 py-1 rounded-full shadow-md">
                            其餘成員
                        </span>
                    `;
                } else {
                    plusCard.className = `avatar-card flex-shrink-0 flex flex-col items-center space-y-2 ${isAnyHiddenSpeaking ? 'speaking' : ''}`;
                    plusCard.innerHTML = `
                        <div class="relative">
                            <div class="avatar-ring w-16 h-16 rounded-full bg-slate-800/90 border-2 border-slate-600/80 flex items-center justify-center text-emerald-400 font-bold text-lg shadow-lg">
                                +${hiddenMembers.length}
                            </div>
                        </div>
                        <span class="user-name text-xs bg-slate-800/90 text-slate-300 px-2.5 py-0.5 rounded-full shadow-md">
                            其餘成員
                        </span>
                    `;
                }

                container.appendChild(plusCard);
            }
        }

        connectBotSocket();
        connectDiscordRPC();
    </script>
</body>
</html>
